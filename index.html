<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Weather Broadcast</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#050b14;color:#fff}body{display:flex;justify-content:center}.app{width:100%;max-width:430px;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);background:linear-gradient(160deg,#10243d,#07111f 48%,#03070d);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}.brand{font-size:12px;letter-spacing:.18em;font-weight:800;text-transform:uppercase;opacity:.72}.live{font-size:11px;font-weight:800;padding:7px 10px;border:1px solid #ffffff26;border-radius:999px;background:#ffffff0d}.live i{display:inline-block;width:6px;height:6px;background:#5df59a;border-radius:50%;margin-right:6px;box-shadow:0 0 10px #5df59a}.location{margin-top:28px}.location small{opacity:.6;font-size:13px}.location h1{font-size:32px;line-height:1.05;margin:5px 0 0;letter-spacing:-1px}.hero{margin-top:26px;text-align:center}.icon{font-size:74px;line-height:1}.temp{font-size:92px;font-weight:300;letter-spacing:-6px;line-height:.95;margin-top:4px}.condition{font-size:17px;font-weight:600;margin-top:10px}.range{font-size:14px;opacity:.65;margin-top:7px}.broadcast{margin-top:28px;border:1px solid #ffffff16;background:#ffffff0b;border-radius:24px;padding:18px;backdrop-filter:blur(18px)}.broadcast .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;font-weight:800}.headline{font-size:18px;font-weight:700;margin:7px 0 5px}.summary{font-size:13px;line-height:1.45;opacity:.65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{padding:12px;border-radius:16px;background:#ffffff0b}.stat b{display:block;font-size:16px}.stat span{font-size:10px;opacity:.5;text-transform:uppercase}.section{margin:22px 0 10px;font-size:13px;font-weight:800;opacity:.7}.forecast{display:flex;gap:8px;overflow:hidden}.day{min-width:74px;padding:13px 8px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff0d;text-align:center}.day.today{background:#ffffff13}.day strong{font-size:11px;display:block;opacity:.65}.day .dicon{font-size:24px;margin:7px 0}.day b{font-size:14px}.day small{display:block;font-size:10px;opacity:.45;margin-top:3px}.footer{padding:18px 0 28px;text-align:center;font-size:10px;opacity:.38}.error{padding:14px;border-radius:16px;background:#ff5d5d18;border:1px solid #ff5d5d30;color:#ffd6d6;font-size:13px;margin-top:20px}button{border:0;color:#fff;background:#ffffff12;border:1px solid #ffffff18;border-radius:14px;padding:11px 14px;font-weight:700;margin-top:12px}@media(min-width:600px){body{padding:24px 0}.app{min-height:calc(100vh - 48px);border-radius:32px;box-shadow:0 30px 80px #0008}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">Weather Broadcast</div><div class="live"><i></i>LIVE</div></header>
<section class="location"><small id="updated">Getting your location…</small><h1 id="place">Locating…</h1></section>
<section class="hero"><div class="icon" id="icon">⏳</div><div class="temp"><span id="temp">--</span>°</div><div class="condition" id="condition">Loading weather</div><div class="range" id="range">--° / --°</div></section>
<section class="broadcast"><div class="label">Local broadcast</div><div class="headline" id="headline">Preparing your weather report…</div><div class="summary" id="summary">Using your phone's current location. Location stays in your browser.</div><div class="grid"><div class="stat"><b id="feels">--°</b><span>Feels like</span></div><div class="stat"><b id="humidity">--%</b><span>Humidity</span></div><div class="stat"><b id="wind">-- km/h</b><span>Wind</span></div></div></section>
<div class="section">8-day outlook</div><section class="forecast" id="forecast"></section><div id="error"></div><footer class="footer">Live data · °C · Powered by Open-Meteo</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',56:'🌧️',57:'🌧️',61:'🌦️',63:'🌧️',65:'🌧️',66:'🌧️',67:'🌧️',71:'🌨️',73:'🌨️',75:'❄️',77:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
const words={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',82:'Heavy rain showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
function weatherText(c){return words[c]||'Mixed conditions'};
function showError(msg){$('error').innerHTML='<div class="error">'+msg+'<br><button onclick="location.reload()">Try again</button></div>'}
async function load(lat,lon){try{
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=8`;
const r=await fetch(url);if(!r.ok)throw Error('Weather service unavailable');const d=await r.json();
let place='Your Location';try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1&language=en&format=json`);const j=await g.json();const x=j.results?.[0];if(x){const city=x.city||x.town||x.village||x.municipality||x.name;const state=x.state;place=city&&state?`${city}, ${state}`:city||state||'Your Location';}}catch(e){}
const c=d.current;$('place').textContent=place;$('updated').textContent='Updated '+new Date(c.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('icon').textContent=icons[c.weather_code]||'🌤️';$('temp').textContent=Math.round(c.temperature_2m);$('condition').textContent=weatherText(c.weather_code);$('range').textContent=`${Math.round(d.daily.temperature_2m_min[0])}° / ${Math.round(d.daily.temperature_2m_max[0])}°`;$('feels').textContent=Math.round(c.apparent_temperature)+'°';$('humidity').textContent=c.relative_humidity_2m+'%';$('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';
const rain=d.daily.precipitation_probability_max[0]||0;$('headline').textContent=rain>=60?'Rain likely today':rain>=30?'Keep an eye on showers':'Mostly settled conditions';$('summary').textContent=`${weatherText(c.weather_code)} now. Rain probability today is ${rain}%.`;
$('forecast').innerHTML=d.daily.time.map((date,i)=>{const dt=new Date(date+'T12:00:00');const day=i===0?'Today':dt.toLocaleDateString([],{weekday:'short'});return `<div class="day ${i===0?'today':''}"><strong>${day}</strong><div class="dicon">${icons[d.daily.weather_code[i]]||'🌤️'}</div><b>${Math.round(d.daily.temperature_2m_max[i])}°</b><small>${Math.round(d.daily.temperature_2m_min[i])}° · ${d.daily.precipitation_probability_max[i]||0}%</small></div>`}).join('');
}catch(e){showError(e.message||'Could not load weather.')}}
if(!navigator.geolocation)showError('Your browser does not support location services.');else navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude),e=>showError('Location access is required to show weather for your current location.'),{enableHighAccuracy:true,timeout:12000,maximumAge:300000});
</script></body></html>
